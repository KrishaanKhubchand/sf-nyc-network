<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SF + NYC network</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<div class="nav"><a class="on" href="index.html">Overview</a><a href="list.html?src=shortlist" id="slnav">♥ Shortlist</a></div>
<h1>SF + NYC network</h1>
<div class="sub">People in 6 X lists who say they’re in San Francisco or New York · click any number to open that slice</div>
<div class="card scroll-x"><table class="mx" id="mx"><tr><td class="l">Loading…</td></tr></table></div>
<div class="note" id="note"></div>
</div>
<script src="app.js"></script>
<script>
(async()=>{
  const [D,H]=await Promise.all([loadData(),loadHearts()]);
  document.getElementById('slnav').textContent=`♥ Shortlist (${H.size})`;
  const P=D.people.filter(p=>p.f<MEGA);
  const cnt=(key,c,r)=>P.filter(p=>p.c===c&&p.r===r&&inSrc(p,key)).length;
  const sep=r=>r==='founders'?'sep':'';
  const link=(key,c,r,n)=>`<a href="list.html?src=${key}&city=${c}&role=${r}">${fmt(n)}</a>`;
  let h='<tr><th class="l" rowspan="2" style="vertical-align:bottom">List</th><th class="city sep" colspan="3">San Francisco</th><th class="city sep" colspan="3">New York</th></tr><tr>'+['SF','NYC'].flatMap(c=>ROLES.map(r=>`<th class="${sep(r)}">${r[0].toUpperCase()+r.slice(1)}</th>`)).join('')+'</tr>';
  for(const l of D.lists){
    const rel=l.rel==='following'?'follows':'followers of';
    h+=`<tr><td class="l"><div class="who"><b>${SHORT[l.key]}</b><span>${rel} · ${l.label}</span></div></td>`+['SF','NYC'].flatMap(c=>ROLES.map(r=>`<td class="${sep(r)}">${link(l.key,c,r,cnt(l.key,c,r))}</td>`)).join('')+'</tr>';
  }
  for(const [key,lab] of [['all','All 6 lists, deduped'],['multi','In 2+ lists']])
    h+=`<tr class="tot"><td class="l">${lab}</td>`+['SF','NYC'].flatMap(c=>ROLES.map(r=>`<td class="${sep(r)}">${link(key,c,r,cnt(key,c,r))}</td>`)).join('')+'</tr>';
  document.getElementById('mx').innerHTML=h;
  const u=c=>P.filter(p=>p.c===c&&p.r==='unclear').length;
  const mega=D.people.length-P.length;
  document.getElementById('note').innerHTML=`Not in the table: people whose bio doesn’t say what they do — <a href="list.html?src=all&city=SF&role=unclear">${fmt(u('SF'))} in SF</a> · <a href="list.html?src=all&city=NYC&role=unclear">${fmt(u('NYC'))} in NYC</a> — and ${mega} mega-accounts over 250K followers (untick “Hide 250K+” on any page).<br>Ziperski’s row is people who <b>follow him</b>; the other five rows are people each person follows. Location and role come from the person’s own X location and bio, so expect some misses.`;
})();
</script></body></html>
